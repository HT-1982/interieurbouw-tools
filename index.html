<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Interieurbouwtools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">

    <!-- LOGO -->
    <div class="logo" onclick="goHome()">
        <img src="images/logo.png" alt="logo">
    </div>

    <!-- NAV -->
    <div class="nav">
        <button onclick="setActive(this); loadPage('pages/home.html')" class="active">Home</button>
        <button onclick="setActive(this); loadPage('pages/calculators.html')"c lass="siderbar">Calculators</button>
        <button onclick="setActive(this); loadPage('pages/tool2.html')">Zaagstaten</button>
    </div>

</div>

<!-- MAIN -->
<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Tools</h3>

        <button onclick="loadPage('pages/tool1.html')">📐 Materiaal Calculator</button>
        <button onclick="loadPage('pages/tool2.html')">📏 Verstek Calculator</button>
        <button onclick="loadPage('pages/tool3.html')">📦 Corpus Generator</button>

        <div class="footer">
            © 2026
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <iframe id="frame" src="pages/home.html"></iframe>
    </div>

</div>

<script>
function loadPage(page) {
    document.getElementById("frame").src = page;
}

function setActive(el) {
    document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

    el.classList.add("active");
}

function goHome() {
    loadPage('pages/home.html');

    document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

    document.querySelector(".nav button").classList.add("active");
}
</script>

</body>
</html>
