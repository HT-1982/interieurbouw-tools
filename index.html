<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Interieurbouwtools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">

    <!-- LOGO (klikbaar naar home) -->
    <div class="logo" onclick="loadPage('pages/home.html')">
        <img src="./images/logo.png" alt="logo">
    </div>

    <!-- NAV -->
    <div class="nav">
        <button onclick="setActive(this); loadPage('pages/home.html')" class="active">Home</button>
        <button onclick="setActive(this); loadPage('pages/tool1.html')">Calculators</button>
        <button onclick="setActive(this); loadPage('pages/tool2.html')">Zaagstaten</button>
    </div>

</div>

<!-- MAIN -->
<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Tools</h3>

        <button onclick="setActive(this); loadPage('pages/tool1.html')">
            📐 Materiaal Calculator
        </button>

        <button onclick="setActive(this); loadPage('pages/tool2.html')">
            📏 Verstek Calculator
        </button>

        <button onclick="setActive(this); loadPage('pages/tool3.html')">
            📦 Corpus Generator
        </button>

        <div class="footer">
            © 2026
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <iframe id="frame" src="pages/home.html"></iframe>
    </div>

</div>

<script>
function loadPage(page) {
    document.getElementById("frame").src = page;
}

/* ACTIVE BUTTON */
function setActive(el) {
    document.querySelectorAll(".active").forEach(btn => btn.classList.remove("active"));
    el.classList.add("active");
}
</script>

</body>
</html>
