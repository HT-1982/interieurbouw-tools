<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Interieurbouwtools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <div class="logo" onclick="goHome()">
        <img src="images/logo.png" alt="logo">
    </div>

    <div class="nav">
        <button onclick="setActive(this); loadSection('home')" class="active">Home</button>
        <button onclick="setActive(this); loadSection('calculators')">Calculators</button>
        <button onclick="setActive(this); loadSection('zaagstaten')">Zaagstaten</button>
    </div>
</div>

<div class="container">

    <div class="sidebar" id="sidebar"></div>

    <div class="content">
        <iframe id="frame"></iframe>
    </div>

</div>

<script>
function loadPage(page) {
    document.getElementById("frame").src = page;
}

function setActive(el) {
    document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));
    el.classList.add("active");
}

function setSidebarActive(el) {
    document.querySelectorAll(".sidebar button")
        .forEach(btn => btn.classList.remove("active"));
    el.classList.add("active");
}

function loadSection(section) {
    const sidebar = document.getElementById("sidebar");

    if (section === "home") {
        sidebar.innerHTML = `
            <h3>Dashboard</h3>
            <button onclick="setSidebarActive(this); loadPage('pages/home.html')" class="active">🏠 Overzicht</button>
        `;
        loadPage('pages/home.html');
    }

    if (section === "calculators") {
        sidebar.innerHTML = `
            <h3>Calculators</h3>
            <button onclick="setSidebarActive(this); loadPage('pages/tool1.html')" class="active">📐 Materiaal Calculator</button>
            <button onclick="setSidebarActive(this); loadPage('pages/tool2.html')">📏 Verstek Calculator</button>
        `;
        loadPage('pages/tool1.html');
    }

    if (section === "zaagstaten") {
        sidebar.innerHTML = `
            <h3>Zaagstaten</h3>
            <button onclick="setSidebarActive(this); loadPage('pages/tool3.html')" class="active">📦 Corpus Generator</button>
        `;
        loadPage('pages/tool3.html');
    }
}

function goHome() {
    document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

    document.querySelector(".nav button").classList.add("active");
    loadSection('home');
}

window.onload = () => loadSection('home');
</script>

</body>
</html>
